################################################################################
# Site Settings
################################################################################
locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &title "Junteng Liu"
description              : &description "Personal academic homepage of Junteng Liu, PhD candidate at HKUST NLP Group."
url                      : https://thienphuong31547-sudo.github.io/LJT-Homepage
repository               : thienphuong31547-sudo/LJT-Homepage
words_per_minute         : 200

# Site Author
author:
  name             : "Junteng Liu"
  avatar           : "profile.png"
  bio              : "First-year PhD candidate at HKUST NLP Group, Hong Kong University of Science and Technology."
  location         : "Hong Kong"
  employer         : "HKUST NLP Group"
  email            : "jliugi@connect.ust.hk"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github           : "Vicent0205"
  twitter          : "junteng88716710"

# Site Footer
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jliugi@connect.ust.hk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "X (Twitter)"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://twitter.com/junteng88716710"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding             : "utf-8"
markdown_ext         : "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

# Markdown Processing
kramdown:
  input              : GFM
  hard_wrap          : false
  auto_ids           : true
  footnote_nr        : 1
  entity_output      : as_char
  toc_levels         : 1..6
  smart_quotes       : lsquo,rsquo,ldquo,rdquo
  enable_coderay     : false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink           : /:categories/:title/
timezone            : Asia/Hong_Kong

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-include-cache

author_profile: true

# Collections
collections:
  publications:
    output       : true
    permalink    : /:collection/:path/
  talks:
    output       : true
    permalink    : /:collection/:path/
  teaching:
    output       : true
    permalink    : /:collection:path/
  portfolio:
    output       : true
    permalink    : /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

# Analytics
analytics:
  provider               : false

# SEO
seo_title: true
seo_description: true

# Social (meta tags in head)
social:
  type: Person
  name: Junteng Liu
  links:
    - "https://github.com/Vicent0205"
    - "https://twitter.com/junteng88716710"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
