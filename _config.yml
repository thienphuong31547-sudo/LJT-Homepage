# Site Settings
locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Junteng Liu - First-year PhD candidate at HKUST NLP Group. Personal homepage with academic background, research experience, publications, and contact information."
url                      : https://thienphuong31547-sudo.github.io
baseurl                  : /LJT-Homepage
repository               : "thienphuong31547-sudo/LJT-Homepage"

# Site Author
author:
  name             : "Junteng Liu"
  avatar           : "profile.png"
  bio              : "First-year PhD candidate at HKUST NLP Group"
  location         : "Hong Kong University of Science and Technology"
  employer         : "HKUST NLP Group"
  email            : "jliugi@connect.ust.hk"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github           : "Vicent0205"
  twitter          : "junteng88716710"

# Reading Files
include:
  - .htaccess
  - _pages
  - .github
  - "*.md"
  - "*.yml"

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true

# Social sharing
twitter:
  username            : "junteng88716710"
facebook:
  username            :
  app_id              :
  app_secret          :
og_image              :

# Analytics
analytics:
  provider            : "google-universal"
  google:
    tracking_id       :

# Reading
read_more             : "true"

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Hong_Kong

# Sass
sass:
  style: :compressed

# HTML Compression
compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-paginate
